<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Directional Derivative Visualizer 3D with Given f_u(P)</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.8.0/math.js"></script>
<script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>
<link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
<style>
  body { background-color: #f9fafb; }
  .card { background-color: white; border-radius: 1rem; box-shadow: 0 4px 20px rgba(0,0,0,0.1); padding: 1.5rem; }
  label.inline-flex { align-items: center; gap: 0.5rem; cursor: pointer; }
  .input-group { margin-bottom: 0.8rem; }
</style>
</head>
<body class="p-6">
<div class="max-w-6xl mx-auto space-y-6">
  <h1 class="text-3xl font-bold text-center mb-4">Directional Derivative Visualizer 3D with Given f_u(P)</h1>

  <div class="card space-y-4 max-w-4xl mx-auto">
    <div class="input-group">
      <label class="font-semibold block mb-1">Function f(x, y, z):</label>
      <input id="func" type="text" value="x^2 + y^2 - z^2" class="w-full p-2 border rounded" />
    </div>

    <div class="grid grid-cols-3 gap-4">
      <div class="input-group">
        <label class="font-semibold block mb-1">Point P (x, y, z):</label>
        <input id="px" type="number" value="1" class="w-full p-2 border rounded" placeholder="x" />
        <input id="py" type="number" value="1" class="w-full p-2 border rounded mt-1" placeholder="y" />
        <input id="pz" type="number" value="1" class="w-full p-2 border rounded mt-1" placeholder="z" />
      </div>
      <div class="input-group">
        <label class="font-semibold block mb-1">Direction u (ux, uy, uz):</label>
        <input id="ux" type="number" value="1" class="w-full p-2 border rounded" placeholder="ux" />
        <input id="uy" type="number" value="0" class="w-full p-2 border rounded mt-1" placeholder="uy" />
        <input id="uz" type="number" value="0" class="w-full p-2 border rounded mt-1" placeholder="uz" />
      </div>
      <div class="input-group">
        <label class="font-semibold block mb-1">Desired directional derivative f_u(P):</label>
        <input id="desiredFu" type="number" value="0" class="w-full p-2 border rounded" placeholder="Enter value" />
      </div>
    </div>

    <div class="flex gap-4">
      <button onclick="plotFunction()" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg shadow flex-1">Visualize (given u)</button>
      <button onclick="findUforGivenFu()" class="px-4 py-2 bg-green-600 hover:bg-green-700 text-white rounded-lg shadow flex-1">Find u for given f_u(P)</button>
    </div>
  </div>

  <div class="card max-w-5xl mx-auto">
    <div id="plot3d" style="height:600px;"></div>
  </div>

  <div class="card max-w-5xl mx-auto">
    <p id="result" class="text-lg font-semibold whitespace-pre-wrap"></p>
  </div>
</div>

<script>
function gradient3D(expr, point) {
  const scope = { x: point[0], y: point[1], z: point[2] };
  const dfdx = math.derivative(expr, 'x').evaluate(scope);
  const dfdy = math.derivative(expr, 'y').evaluate(scope);
  const dfdz = math.derivative(expr, 'z').evaluate(scope);
  return [dfdx, dfdy, dfdz];
}

function normalize(vec) {
  const norm = math.norm(vec);
  if(norm === 0) return [0,0,0];
  return math.divide(vec, norm);
}

// Visualize with given u
function plotFunction() {
  const funcStr = document.getElementById('func').value;
  const px = parseFloat(document.getElementById('px').value);
  const py = parseFloat(document.getElementById('py').value);
  const pz = parseFloat(document.getElementById('pz').value);

  const ux = parseFloat(document.getElementById('ux').value);
  const uy = parseFloat(document.getElementById('uy').value);
  const uz = parseFloat(document.getElementById('uz').value);

  if (isNaN(ux) || isNaN(uy) || isNaN(uz)) {
    alert('Please enter valid numbers for direction vector u.');
    return;
  }

  const grad = gradient3D(funcStr, [px, py, pz]);
  const normU = math.norm([ux, uy, uz]);
  if (normU === 0) {
    alert('Direction vector u cannot be zero.');
    return;
  }
  const uNorm = math.divide([ux, uy, uz], normU);

  const fuP = math.dot(grad, uNorm);
  const dirDerivativeVec = math.multiply(uNorm, fuP);

  document.getElementById('result').innerHTML =
    `<b>Gradient ∇f(P):</b> (${grad.map(v => v.toFixed(3)).join(', ')})\n` +
    `<b>Unit direction vector û:</b> (${uNorm.map(v => v.toFixed(3)).join(', ')})\n` +
    `<b>Directional derivative f_u(P):</b> ${fuP.toFixed(4)}\n` +
    `<b>Directional derivative vector f_u(P)·û:</b> (${dirDerivativeVec.map(v => v.toFixed(3)).join(', ')})`;

  plot3DLevelSurface(funcStr, px, py, pz, [
    {
      type: 'scatter3d',
      mode: 'lines+markers',
      x: [px, px + grad[0]],
      y: [py, py + grad[1]],
      z: [pz, pz + grad[2]],
      line: { color: 'red', width: 6 },
      marker: { size: 4, color: 'red' },
      name: 'Gradient ∇f(P)'
    },
    {
      type: 'scatter3d',
      mode: 'lines+markers',
      x: [px, px + uNorm[0]],
      y: [py, py + uNorm[1]],
      z: [pz, pz + uNorm[2]],
      line: { color: 'green', width: 6 },
      marker: { size: 4, color: 'green' },
      name: 'Unit direction û'
    },
    {
      type: 'scatter3d',
      mode: 'lines+markers',
      x: [px, px + dirDerivativeVec[0]],
      y: [py, py + dirDerivativeVec[1]],
      z: [pz, pz + dirDerivativeVec[2]],
      line: { color: 'blue', width: 6 },
      marker: { size: 4, color: 'blue' },
      name: 'Directional derivative vector f_u(P)·û'
    }
  ]);
}

// Find and visualize u for given desired f_u(P)
function findUforGivenFu() {
  const funcStr = document.getElementById('func').value;
  const px = parseFloat(document.getElementById('px').value);
  const py = parseFloat(document.getElementById('py').value);
  const pz = parseFloat(document.getElementById('pz').value);

  const desiredFu = parseFloat(document.getElementById('desiredFu').value);
  if (isNaN(desiredFu)) {
    alert('Please enter a valid number for desired f_u(P).');
    return;
  }

  const grad = gradient3D(funcStr, [px, py, pz]);
  const gradMag = math.norm(grad);

  if (gradMag === 0) {
    alert('Gradient vector is zero at point P. Directional derivative is always zero.');
    return;
  }

  if (desiredFu < -gradMag || desiredFu > gradMag) {
    alert(`Desired f_u(P) must be between -|∇f(P)| = ${-gradMag.toFixed(3)} and |∇f(P)| = ${gradMag.toFixed(3)}.`);
    return;
  }

  // Vector part parallel to grad (scaled)
  const v_parallel = math.multiply(grad, desiredFu / (gradMag * gradMag));

  // We want to find all unit vectors u: u = v_parallel + v_orthogonal
  // where |u|=1 => |v_parallel + v_orthogonal| =1
  // So |v_orthogonal| = sqrt(1 - |v_parallel|^2)

  const v_parallel_mag = math.norm(v_parallel);
  const orth_radius = Math.sqrt(1 - v_parallel_mag * v_parallel_mag);

  // Find two orthonormal vectors orthogonal to grad for parametrizing the circle:
  // Gram-Schmidt:
  // Start with any vector not colinear with grad
  const grad_unit = normalize(grad);

  function orthonormalBasis(v) {
    let a = [1, 0, 0];
    if (Math.abs(math.dot(a, v)) > 0.9) a = [0, 1, 0];
    let e1 = math.subtract(a, math.multiply(v, math.dot(a, v)));
    e1 = normalize(e1);
    let e2 = math.cross(v, e1);
    e2 = normalize(e2);
    return [e1, e2];
  }

  const [e1, e2] = orthonormalBasis(grad_unit);

  // Parametrize circle of solutions u = v_parallel + orth_radius*(cos t * e1 + sin t * e2), t in [0, 2π]
  // We'll sample some points for visualization

  const circlePoints = { x: [], y: [], z: [] };
  const pxC = px, pyC = py, pzC = pz;

  const samples = 50;
  for(let i = 0; i < samples; i++) {
    const t = 2 * Math.PI * i / samples;
    const orthVec = math.add(
      math.multiply(e1, Math.cos(t) * orth_radius),
      math.multiply(e2, Math.sin(t) * orth_radius)
    );
    const uVec = math.add(v_parallel, orthVec); // This is a unit vector satisfying dot = desiredFu
    circlePoints.x.push(pxC + uVec[0]);
    circlePoints.y.push(pyC + uVec[1]);
    circlePoints.z.push(pzC + uVec[2]);
  }

  // For example, pick t=0 vector to display explicitly
  const exampleU = math.add(v_parallel, math.multiply(e1, orth_radius));

  // Also compute directional derivative vector = f_u(P)*u
  const dirDerivVec = math.multiply(exampleU, desiredFu);

  document.getElementById('result').innerHTML =
    `<b>Gradient ∇f(P):</b> (${grad.map(v => v.toFixed(3)).join(', ')})\n` +
    `<b>|∇f(P)|:</b> ${gradMag.toFixed(4)}\n` +
    `<b>Desired directional derivative f_u(P):</b> ${desiredFu.toFixed(4)}\n` +
    `<b>Example unit vector û satisfying ∇f(P)·û = f_u(P):</b> (${exampleU.map(v => v.toFixed(3)).join(', ')})\n` +
    `<b>Directional derivative vector f_u(P)·û:</b> (${dirDerivVec.map(v => v.toFixed(3)).join(', ')})\n` +
    `<b>Circle of all such unit vectors is shown as purple points on unit sphere centered at P.</b>`;

  // Plot everything:
  // Level surface + gradient vector + example u vector + circle points

  // Level surface points:
  const range = math.range(-2, 2.1, 0.2).toArray();
  const levelSurfacePoints = { x: [], y: [], z: [] };
  const fP = math.evaluate(funcStr, { x: px, y: py, z: pz });
  range.forEach(x => {
    range.forEach(y => {
      range.forEach(z => {
        const val = math.evaluate(funcStr, { x, y, z });
        if (Math.abs(val - fP) < 0.1) {
          levelSurfacePoints.x.push(x);
          levelSurfacePoints.y.push(y);
          levelSurfacePoints.z.push(z);
        }
      });
    });
  });

  const surface = {
    x: levelSurfacePoints.x,
    y: levelSurfacePoints.y,
    z: levelSurfacePoints.z,
    mode: 'markers',
    type: 'scatter3d',
    marker: { size: 2, color: 'lightblue' },
    name: 'Level Surface'
  };

  const gradVec = {
    type: 'scatter3d',
    mode: 'lines+markers',
    x: [px, px + grad[0]],
    y: [py, py + grad[1]],
    z: [pz, pz + grad[2]],
    line: { color: 'red', width: 6 },
    marker: { size: 4, color: 'red' },
    name: 'Gradient ∇f(P)'
  };

  const exampleUVec = {
    type: 'scatter3d',
    mode: 'lines+markers',
    x: [px, px + exampleU[0]],
    y: [py, py + exampleU[1]],
    z: [pz, pz + exampleU[2]],
    line: { color: 'orange', width: 6 },
    marker: { size: 4, color: 'orange' },
    name: 'Example unit vector û'
  };

  const circleVec = {
    type: 'scatter3d',
    mode: 'markers',
    x: circlePoints.x,
    y: circlePoints.y,
    z: circlePoints.z,
    marker: {
      size: 3,
      color: 'purple',
      opacity: 0.7
    },
    name: 'All unit vectors u satisfying ∇f·u = f_u(P)'
  };

  Plotly.newPlot('plot3d', [surface, gradVec, exampleUVec, circleVec], {
    scene: {
      xaxis: { title: 'X', range: [px-2, px+2] },
      yaxis: { title: 'Y', range: [py-2, py+2] },
      zaxis: { title: 'Z', range: [pz-2, pz+2] },
      camera: { eye: { x: 1.5, y: 1.5, z: 1.5 } }
    },
    margin: { l: 0, r: 0, b: 0, t: 0 }
  });
}
  
function plot3DLevelSurface(funcStr, px, py, pz, vectors) {
  const range = math.range(-2, 2.1, 0.2).toArray();
  const points = { x: [], y: [], z: [] };
  const fP = math.evaluate(funcStr, { x: px, y: py, z: pz });

  range.forEach(x => {
    range.forEach(y => {
      range.forEach(z => {
        const val = math.evaluate(funcStr, { x, y, z });
        if (Math.abs(val - fP) < 0.1) {
          points.x.push(x);
          points.y.push(y);
          points.z.push(z);
        }
      });
    });
  });

  const surface = {
    x: points.x,
    y: points.y,
    z: points.z,
    mode: 'markers',
    type: 'scatter3d',
    marker: { size: 2, color: 'lightblue' },
    name: 'Level Surface'
  };

  Plotly.newPlot('plot3d', [surface, ...vectors], {
    scene: {
      xaxis: { title: 'X' },
      yaxis: { title: 'Y' },
      zaxis: { title: 'Z' },
      camera: { eye: { x: 1.2, y: 1.2, z: 1.2 } }
    },
    margin: { l: 0, r: 0, b: 0, t: 0 }
  });
}
</script>
</body>
</html>
