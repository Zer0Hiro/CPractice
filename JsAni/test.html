<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Canvas Flowfield Aurora</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: black;
      height: 100%;
      width: 100%;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <script>
    /**
     * Flowfield Aurora Visualization
     * High-quality particle simulation using Canvas API
     * - Smooth aurora-like trails
     * - Mouse interactivity (move to influence, click to toggle attract/repel)
     */

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    // Resize handling
    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });

    // Config
    const numParticles = 2000;
    const fieldScale = 0.0015;
    const speed = 0.8;

    const particles = [];
    const mouse = { x: width / 2, y: height / 2, attract: true };

    // Particle class
    class Particle {
      constructor() {
        this.reset();
      }
      reset() {
        this.x = Math.random() * width;
        this.y = Math.random() * height;
        this.vx = 0;
        this.vy = 0;
        this.alpha = Math.random() * 0.8 + 0.2;
        this.hue = Math.random() * 360;
      }
      update() {
        // Flow field vector
        const angle = noise(this.x * fieldScale, this.y * fieldScale) * Math.PI * 2;
        this.vx += Math.cos(angle) * 0.1;
        this.vy += Math.sin(angle) * 0.1;

        // Mouse influence
        const dx = mouse.x - this.x;
        const dy = mouse.y - this.y;
        const dist = Math.sqrt(dx * dx + dy * dy) || 1;
        if (dist < 200) {
          const force = (1 - dist / 200) * (mouse.attract ? 0.6 : -0.6);
          this.vx += (dx / dist) * force;
          this.vy += (dy / dist) * force;
        }

        // Apply velocity
        this.vx *= 0.92;
        this.vy *= 0.92;
        this.x += this.vx * speed;
        this.y += this.vy * speed;

        // Wrap around edges
        if (this.x < 0) this.x = width;
        if (this.x > width) this.x = 0;
        if (this.y < 0) this.y = height;
        if (this.y > height) this.y = 0;
      }
      draw() {
        ctx.fillStyle = `hsla(${this.hue}, 100%, 70%, ${this.alpha})`;
        ctx.fillRect(this.x, this.y, 1.5, 1.5);
      }
    }

    // Simplex-like noise (replacement for perlin)
    function noise(x, y) {
      return Math.sin(x * 12.9898 + y * 78.233) * 43758.5453 % 1;
    }

    // Initialize particles
    for (let i = 0; i < numParticles; i++) {
      particles.push(new Particle());
    }

    // Mouse handling
    canvas.addEventListener('mousemove', e => {
      mouse.x = e.clientX;
      mouse.y = e.clientY;
    });
    canvas.addEventListener('click', () => {
      mouse.attract = !mouse.attract;
    });

    // Animation loop
    function animate() {
      requestAnimationFrame(animate);

      ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
      ctx.fillRect(0, 0, width, height);

      for (const p of particles) {
        p.update();
        p.draw();
      }
    }

    animate();

    // FRAMEWORK_COMMAND: SUBMIT_FINAL_CODE
  </script>
</body>
</html>
